<!DOCTYPE html>
<html>
<head>
    <title>Architecture Portfolios</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
    
    <script>
        // Globally disable the download button for all flipbooks
        var dfOptions = {
            hideDownload: true
        };

        // Switch from landing screen to selected flipbook
        function openPortfolio(id) {
            document.getElementById('landing').style.display = 'none';
            document.getElementById('book1-wrapper').style.display = 'none';
            document.getElementById('book2-wrapper').style.display = 'none';
            
            document.getElementById(id).style.display = 'block';
        }

        // Switch from flipbook back to landing screen
        function showLanding() {
            document.getElementById('book1-wrapper').style.display = 'none';
            document.getElementById('book2-wrapper').style.display = 'none';
            document.getElementById('landing').style.display = 'flex';
        }
    </script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        
        /* Dynamic Fluid Background */
        #landing {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: fluidBackground 15s ease infinite;
        }

        @keyframes fluidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Selection Cards */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            width: 220px;
        }
        
        .card:hover { transform: translateY(-10px); }
        .card h2 { margin: 0 0 10px 0; font-size: 22px; color: #222; }
        .card p { margin: 0; color: #666; font-size: 14px; }

        /* Flipbook containers */
        .book-wrapper {
            display: none;
            height: 100vh;
            width: 100vw;
            background: #e5e5e5;
            position: relative;
        }

        /* Return button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
            padding: 10px 18px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background: #444; }
        
        ._df_book { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="landing">
        <div class="card" onclick="openPortfolio('book1-wrapper')">
            <h2>Portfolio 1</h2>
            <p>View Collection</p>
        </div>
        <div class="card" onclick="openPortfolio('book2-wrapper')">
            <h2>Portfolio 2</h2>
            <p>View Collection</p>
        </div>
    </div>

    <div id="book1-wrapper" class="book-wrapper">
        <button class="back-btn" onclick="showLanding()">← Back to Menu</button>
        <div class="_df_book" source="portfolio1.pdf" id="book1"></div>
    </div>

    <div id="book2-wrapper" class="book-wrapper">
        <button class="back-btn" onclick="showLanding()">← Back to Menu</button>
        <div class="_df_book" source="portfolio2.pdf" id="book2"></div>
    </div>

</body>
</html>
